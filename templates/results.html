{% extends "layout.html" %}
{% block title %}{{ _("Your results") }}{% endblock %}
{% block main %}
<div id="results">
    <section class="container page-section text-center">
        <noscript><div class="alert alert-warning">{{ _("Your results are calculated in your browser, which needs JavaScript.") }}</div></noscript>
        <p class="text-secondary" id="results-loading">{{ _("Calculating...") }}</p>
    </section>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"
        integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
        integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"
        integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="{{ asset_base }}static/js/data{{ lang_suffix }}.js"></script>
<script src="{{ asset_base }}static/js/ses.js"></script>
<script>window.SES_BASE = "{{ base }}"; window.SES_ASSET_BASE = "{{ asset_base }}"; window.SES_LANG = "{{ lang }}";</script>
<script src="{{ asset_base }}static/js/{{ results_js }}"></script>
{% endblock %}
