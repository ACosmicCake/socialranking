{% extends "layout.html" %}
{% block title %}
    Education Details
{% endblock %}

{% block main %}
<div class="bg-image d-flex flex-column justify-content-center align-items-center" id="outer">
    <div class="container" id="inner">
        <h1 class="text-white text-center mb-4">Education Details</h1>
        <div class="text-white">
            <p>Your education score is: {{ education }}</p>
            <p>This score is based on your level of education.</p>
            <a class="btn btn-secondary" href="/result" role="button">Back to Results</a>
        </div>
    </div>
</div>
{% endblock %}
